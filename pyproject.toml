[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-arquivos-ia"
version = "2.0.0"
description = "Organiza pastas bagunçadas lendo o conteúdo dos arquivos com um LLM (Claude ou um modelo local via Ollama)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Davi Kazuhiro" }]
dependencies = [
    "anthropic>=2.6",
    "httpx>=0.27",
    "pydantic>=2",
    "pypdf>=4",
    "python-docx>=1.1",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[project.scripts]
organizador = "organizador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
